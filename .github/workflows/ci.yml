name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  CI: true
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore EnkaDotNet.sln --locked-mode

      - name: Build
        run: dotnet build EnkaDotNet.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test EnkaDotNet.sln --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Pack
        run: |
          dotnet pack EnkaDotNet/EnkaDotNet.csproj --configuration Release --no-build --output ./artifacts
          dotnet pack EnkaDotNet.Caching.Sqlite/EnkaDotNet.Caching.Sqlite.csproj --configuration Release --no-build --output ./artifacts
          dotnet pack EnkaDotNet.Caching.Redis/EnkaDotNet.Caching.Redis.csproj --configuration Release --no-build --output ./artifacts

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: ./artifacts/*.nupkg

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/test-results.trx'
